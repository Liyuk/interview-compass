  - id: interview-compass-original-topic-expansion-micro-frontends
    title: Interview Compass 原创主题补充：微前端
    status: used
    questions:
      - a-mfe-independent-deploy-boundary
      - a-mfe-shell-routing-history-contract
      - a-mfe-css-style-isolation-collision
      - a-mfe-shared-dependencies-version-governance
      - a-mfe-auth-session-cross-app
      - a-mfe-cross-app-event-contract
      - a-mfe-runtime-failure-isolation
      - a-mfe-cross-team-observability
      - a-mfe-monolith-incremental-extraction
