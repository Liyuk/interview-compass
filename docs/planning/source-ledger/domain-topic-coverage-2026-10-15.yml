sources:
  - id: interview-compass-original-topic-expansion-microservices
    title: Interview Compass 原创主题补充：微服务
    status: used
    questions:
      - a-microservices-team-boundary-change
      - a-microservices-saga-compensation-boundary
      - a-microservices-contract-version-rollout
      - a-microservices-timeout-retry-amplification
