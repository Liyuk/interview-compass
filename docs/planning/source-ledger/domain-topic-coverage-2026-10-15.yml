  - id: interview-compass-original-topic-expansion-resilience
    title: Interview Compass 原创主题补充：韧性与恢复
    status: used
    questions:
      - g-resilience-rebuild-after-strategy-reversal
      - g-resilience-learn-without-overgeneralizing
      - g-resilience-priority-interruptions-recovery
      - g-resilience-critical-feedback-boundaries
