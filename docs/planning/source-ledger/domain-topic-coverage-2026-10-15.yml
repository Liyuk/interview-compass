    title: Interview Compass 原创主题补充：Monorepo
    status: used
    questions:
      - a-monorepo-package-ownership-contract
      - a-monorepo-build-graph-invalidation
      - a-monorepo-cyclic-dependency-boundary
      - a-monorepo-selective-ci-change-detection
      - a-monorepo-codeowner-permission-boundaries
      - a-monorepo-package-release-independent-versioning
      - a-monorepo-migration-repo-split-sequence
    note: 补充包所有权、构建图、依赖环、选择性 CI、权限、版本策略和仓库迁移。
  - id: interview-compass-original-topic-expansion-framework-compiler-mobile-planning
    title: Interview Compass 原创主题补充：框架、编译、客户端与技术规划
    status: used
    questions:
      - a-framework-form-state-validation-boundary
      - a-framework-server-state-cache-invalidation
      - a-framework-upgrade-hidden-default-change
      - a-framework-async-transition-stale-result
      - a-compiler-incremental-build-dependency-invalidation
      - a-compiler-diagnostic-source-map-macro-expansion
      - a-compiler-language-abi-boundary-change
