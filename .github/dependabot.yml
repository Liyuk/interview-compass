# Workflows pin GitHub Actions to commit SHAs. Dependabot updates those
# pins in place; leave the actions pinned.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # @astrojs/check 0.9.x peers typescript ^5 || ^6; TypeScript 7 breaks `npm ci`.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
