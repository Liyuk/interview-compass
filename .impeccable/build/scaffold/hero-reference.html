<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: question-causal-comparison-matrix.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-masthead region chrome" data-region="masthead"><!-- White global navigation; logo, section links, bilingual switch, profile icon. --></div>
  <div class="r-search region control" data-region="search"><!-- Wide bilingual question search and red submit button; keep keyboard focus visible.: rebuild the control's chrome from the crop (comp-spec.mjs --crop search); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-topic-index region chrome" data-region="topic-index"><!-- Quiet left topic navigation with active red marker and no fabricated counts. --></div>
  <div class="r-breadcrumbs region text" data-region="breadcrumbs"><!-- Question index and topic breadcrumbs. --><p style="font-size:var(--r-breadcrumbs-font);line-height:1.05;margin:0">breadcrumbs</p></div>
  <div class="r-question-title region text" data-region="question-title"><!-- Dominant Chinese question title; editorial serif, dark ink. --><p style="font-size:var(--r-question-title-font);font-family:var(--r-question-title-family),sans-serif;font-weight:var(--r-question-title-weight);line-height:1.05;margin:0">question-title</p></div>
  <div class="r-question-path-labels region text" data-region="question-path-labels"><!-- Three numbered sections: intent, related topics, source and extension. --><p style="font-size:var(--r-question-path-labels-font);line-height:1.05;margin:0">question-path-labels</p></div>
  <div class="r-intent-heading region text" data-region="intent-heading"><!-- Detail section label 考察意图. --><p style="font-size:var(--r-intent-heading-font);line-height:1.05;margin:0">intent-heading</p></div>
  <div class="r-intent-copy region text" data-region="intent-copy"><!-- Third step summary: sources and extension context. --><p style="font-size:var(--r-intent-copy-font);line-height:1.05;margin:0">intent-copy</p></div>
  <div class="r-intent-callout region control" data-region="intent-callout"><!-- Muted intent callout beneath the first detail heading.: rebuild the control's chrome from the crop (comp-spec.mjs --crop intent-callout); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-topics-heading region text" data-region="topics-heading"><!-- Detail section label 相关主题. --><p style="font-size:var(--r-topics-heading-font);line-height:1.05;margin:0">topics-heading</p></div>
  <div class="r-topics-links region control" data-region="topics-links"><!-- Linked topic labels for resource allocation, prioritization, planning and execution.: rebuild the control's chrome from the crop (comp-spec.mjs --crop topics-links); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-sources-heading region text" data-region="sources-heading"><!-- Detail section label 来源与延伸. --><p style="font-size:var(--r-sources-heading-font);line-height:1.05;margin:0">sources-heading</p></div>
  <div class="r-sources-copy region text" data-region="sources-copy"><!-- Related-question comparison context. --><p style="font-size:var(--r-sources-copy-font);line-height:1.05;margin:0">sources-copy</p></div>
  <div class="r-comparison-heading region text" data-region="comparison-heading"><!-- Column headings for the related-question comparison matrix. --><p style="font-size:var(--r-comparison-heading-font);line-height:1.05;margin:0">comparison-heading</p></div>
  <div class="r-comparison-question-column region text" data-region="comparison-question-column"><!-- Related question prompts; focus on question wording. --><p style="font-size:var(--r-comparison-question-column-font);line-height:1.05;margin:0">comparison-question-column</p></div>
  <div class="r-comparison-relation-column region text" data-region="comparison-relation-column"><!-- How each adjacent question relates to the current question. --><p style="font-size:var(--r-comparison-relation-column-font);line-height:1.05;margin:0">comparison-relation-column</p></div>
  <div class="r-comparison-difference-column region text" data-region="comparison-difference-column"><!-- Main difference in what the question is intended to explore. --><p style="font-size:var(--r-comparison-difference-column-font);line-height:1.05;margin:0">comparison-difference-column</p></div>
</main>
</body>
</html>
